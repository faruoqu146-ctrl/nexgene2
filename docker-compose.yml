services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexgene
      POSTGRES_USER: nexgene
      POSTGRES_PASSWORD: nexgene_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexgene:nexgene_dev_only@db:5432/nexgene
      JWT_SECRET: nexgene_dev_secret_change_me
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
